title: PowerShell Credential Access via GetNetworkCredential
id: 452e2800-327a-4a24-a297-0c6e2945f2c0
status: experimental

description: Detects PowerShell Script Block Logging events containing GetNetworkCredential, which may indicate credential-related script activity.

logsource:
  product: windows
  service: powershell

detection:
  selection:
    EventID: 4104
    ScriptBlockText|contains: 'GetNetworkCredential'

  condition: selection

falsepositives:
  - Legitimate administrative PowerShell scripts
  - Approved credential-handling automation
  - Internal testing scripts

level: medium

tags:
  - attack.credential-access