title: SMB Network Connection
id: b7949dff-690e-44f8-b10f-03ff52aa7125
status: experimental

description: Detects Windows Sysmon network connections to destination port 445, commonly associated with SMB.

logsource:
  product: windows
  category: network_connection

detection:
  selection:
    DestinationPort: 445
    Protocol: tcp

  condition: selection

falsepositives:
  - Legitimate file sharing
  - Authorized administrative access
  - Internal Windows service communication

level: medium

tags:
  - attack.lateral-movement
  - attack.t1021.002