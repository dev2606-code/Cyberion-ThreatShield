{% if message %}
<div class="message success forgot-message">
    {{ message }}
</div>
{% endif %}

<form method="POST" class="forgot-form">

    <div class="login-field forgot-field">
        <label for="email">Email Address</label>

        <input
            id="email"
            name="email"
            type="email"
            placeholder="Enter registered email"
            autocomplete="email"
            required
        >
    </div>

    <button class="login-button forgot-button" type="submit">
        Send Reset Link
    </button>

</form>

<p class="forgot-back">
    Remember your password?
    <a href="{{ url_for('login') }}">Back to Sign In</a>
</p>
